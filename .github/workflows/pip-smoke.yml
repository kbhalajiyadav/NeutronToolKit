name: Pip install and notebook/browser smoke tests
on: [push, pull_request]
jobs:
  pip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with same pip path as Colab
        run: python -m pip install -e . pytest pandas ipywidgets streamlit
      - name: Verify scientific imports
        run: |
          python -c "from neutrontoolkit.cli import doctor; print(doctor())"
          python -m neutrontoolkit doctor
      - name: Run tests
        run: python -m pytest -q
